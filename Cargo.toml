[workspace]
resolver = "2"
members = [
    "crates/autenticacao",
    "crates/instalador_de_versoes",
    "crates/inicializador_do_jogo",
    "crates/launcher",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
dirs = "5"

autenticacao = { path = "crates/autenticacao" }
instalador_de_versoes = { path = "crates/instalador_de_versoes" }
inicializador_do_jogo = { path = "crates/inicializador_do_jogo" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
